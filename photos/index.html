<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WC — Interesanti fakti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #e0e0e0;
        }

        .container {
            max-width: 650px;
            width: 90%;
            padding: 1.5rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 1rem;
        }

        .fact-card {
            background: rgba(255,255,255,0.08);
            border-radius: 1rem;
            overflow: hidden;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: opacity 0.3s;
        }

        .fact-card.loading {
            opacity: 0.4;
        }

        .fact-image {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            display: block;
        }

        .fact-body {
            padding: 1.2rem;
            flex: 1;
            overflow-y: auto;
        }

        .fact-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .fact-text {
            font-size: 0.9rem;
            line-height: 1.6;
            color: rgba(255,255,255,0.8);
        }

        .fact-source {
            margin-top: 0.6rem;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.35);
        }

        .fact-source a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
        }

        .fact-source a:hover {
            text-decoration: underline;
        }

        .spinner-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }

        .spinner-wrap.active {
            display: block;
        }

        .spinner-ring {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #00bfa5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.7rem 1.8rem;
            background: #00695c;
            color: white;
            border: none;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            font-family: inherit;
        }

        .btn:hover {
            background: #004d40;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: default;
            transform: none;
        }

        .btn-small {
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.12);
        }

        .btn-small:hover {
            background: rgba(255,255,255,0.2);
        }

        .back-link {
            margin-top: 1rem;
            margin-bottom: 1rem;
            display: inline-block;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover {
            color: #fff;
        }

        .nav-arrows {
            display: none;
        }

        .nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
            border: none;
            font-size: 1.5rem;
            width: 40px;
            height: 70px;
            cursor: pointer;
        }

        .nav-arrow:active {
            background: rgba(255,255,255,0.25);
        }

        .nav-arrow-left {
            left: 0;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .nav-arrow-right {
            right: 0;
            border-radius: 0.5rem 0 0 0.5rem;
        }

        .no-image .fact-image {
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                width: 100%;
                padding: 0;
                min-height: 100vh;
                min-height: 100dvh;
            }

            h1 { display: none; }

            .fact-card {
                border-radius: 0;
                border: none;
            }

            .fact-image {
                max-height: 250px;
            }

            .controls { display: none; }

            .nav-arrows { display: block; }

            .back-link {
                position: fixed;
                bottom: 0.8rem;
                left: 50%;
                transform: translateX(-50%);
                z-index: 10;
                background: rgba(0,0,0,0.6);
                padding: 0.4rem 1rem;
                border-radius: 1rem;
                font-size: 0.8rem;
            }
        }

        @media (min-width: 601px) {
            .nav-arrows { display: block; }
        }

        .site-logo {
            position: fixed;
            top: 0.7rem;
            left: 0.7rem;
            z-index: 1000;
            height: 36px;
            transition: transform 0.2s;
        }

        .site-logo:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <a href="/"><img src="/logo.svg" alt="WC" class="site-logo"></a>
    <div class="container">
        <h1>&#128161; Interesanti fakti</h1>

        <div class="fact-card" id="factCard" style="position:relative;">
            <div class="spinner-wrap active" id="spinner">
                <div class="spinner-ring"></div>
            </div>
            <img class="fact-image" id="factImage" alt="">
            <div class="fact-body">
                <div class="fact-title" id="factTitle"></div>
                <div class="fact-text" id="factText"></div>
                <div class="fact-source" id="factSource"></div>
            </div>
        </div>

        <div class="nav-arrows">
            <button class="nav-arrow nav-arrow-left" id="navLeft">&#8249;</button>
            <button class="nav-arrow nav-arrow-right" id="navRight">&#8250;</button>
        </div>

        <div class="controls">
            <button class="btn btn-small" id="prevBtn" disabled>&#8592; Iepriek&#353;&#275;jais</button>
            <button class="btn" id="nextBtn">N&#257;kamais fakts &#8594;</button>
        </div>

        <a href="/" class="back-link">&#8592; Atpaka&#316;</a>
    </div>

    <script>
        const factCard = document.getElementById('factCard');
        const factImage = document.getElementById('factImage');
        const factTitle = document.getElementById('factTitle');
        const factText = document.getElementById('factText');
        const factSource = document.getElementById('factSource');
        const spinner = document.getElementById('spinner');
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');

        let isLoading = false;
        let factQueue = [];
        let history = [];
        let historyIndex = -1;

        async function fetchRandomFact() {
            const res = await fetch('https://lv.wikipedia.org/api/rest_v1/page/random/summary');
            const data = await res.json();
            return {
                title: data.title,
                text: data.extract,
                image: data.thumbnail ? data.thumbnail.source : null,
                url: data.content_urls ? data.content_urls.desktop.page : null
            };
        }

        async function fillQueue() {
            const promises = [];
            for (let i = 0; i < 5; i++) {
                promises.push(fetchRandomFact().catch(() => null));
            }
            const results = await Promise.all(promises);
            const good = results.filter(r => r && r.text && r.text.length > 80);
            factQueue.push(...good);
        }

        function showFact(fact) {
            if (fact.image) {
                factImage.src = fact.image;
                factImage.style.display = 'block';
                factCard.classList.remove('no-image');
            } else {
                factImage.style.display = 'none';
                factCard.classList.add('no-image');
            }
            factTitle.textContent = fact.title;
            factText.textContent = fact.text;
            if (fact.url) {
                factSource.innerHTML = '<a href="' + fact.url + '" target="_blank">Wikipedia &#8599;</a>';
            } else {
                factSource.textContent = '';
            }
            factCard.classList.remove('loading');
            spinner.classList.remove('active');
            isLoading = false;
            nextBtn.disabled = false;
            prevBtn.disabled = historyIndex <= 0;
        }

        async function loadNext() {
            if (isLoading) return;
            isLoading = true;
            factCard.classList.add('loading');
            spinner.classList.add('active');
            nextBtn.disabled = true;

            if (factQueue.length < 3) {
                await fillQueue();
            }

            if (factQueue.length === 0) {
                await fillQueue();
            }

            if (factQueue.length > 0) {
                const fact = factQueue.shift();
                history.push(fact);
                historyIndex = history.length - 1;
                showFact(fact);
            } else {
                factTitle.textContent = 'Neizdev&#257;s iel&#257;d&#275;t';
                factText.textContent = 'M&#275;&#291;ini v&#275;lreiz.';
                factCard.classList.remove('loading');
                spinner.classList.remove('active');
                isLoading = false;
                nextBtn.disabled = false;
            }
        }

        function goBack() {
            if (historyIndex <= 0 || isLoading) return;
            historyIndex--;
            showFact(history[historyIndex]);
        }

        function goForward() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                showFact(history[historyIndex]);
            } else {
                loadNext();
            }
        }

        nextBtn.addEventListener('click', loadNext);
        prevBtn.addEventListener('click', goBack);
        document.getElementById('navLeft').addEventListener('click', goBack);
        document.getElementById('navRight').addEventListener('click', goForward);

        // Swipe
        let touchStartX = 0;
        let touchStartY = 0;

        factCard.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        factCard.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
                if (dx < 0) goForward();
                else goBack();
            }
        }, { passive: true });

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goForward(); }
            if (e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
        });

        loadNext();
    </script>
</body>
</html>
